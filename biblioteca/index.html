<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#55158D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Biblioteca CEMTN">

  <title>Biblioteca CEMTN</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-biblioteca-cemtn-192.png">
  <link rel="apple-touch-icon" href="./icon-biblioteca-cemtn-512.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #FAF5FF;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #FAF5FF;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #3B0764, #5B21B6);
      color: white;
      transition: opacity .25s ease;
    }

    .splash-box {
      text-align: center;
      padding: 28px;
    }

    .splash-box img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 12px 30px #0004;
      margin-bottom: 16px;
    }

    .splash-box h1 {
      margin: 0;
      font-size: 23px;
    }

    .splash-box p {
      margin: 8px 0 0;
      opacity: .88;
      font-size: 14px;
    }

    #installBtn {
      display: none;
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-weight: 700;
      font-size: 15px;
      background: #5B21B6;
      color: #fff;
      box-shadow: 0 8px 24px #0004;
      cursor: pointer;
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 25;
      padding: 24px;
      background: #FAF5FF;
      color: #2E1065;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #fallback a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #5B21B6;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div id="splash">
    <div class="splash-box">
      <img src="./icon-biblioteca-cemtn-192.png" alt="">
      <h1>Biblioteca CEMTN</h1>
      <p>Carregando sua biblioteca…</p>
    </div>
  </div>

  <iframe
    id="app"
    title="Biblioteca Digital CEMTN"
    src="https://script.google.com/macros/s/AKfycbz1ltATqjcvV8HHtRjmbyXtT2BEH42v11NLYXEhy03x0BLDoWt8YbODK_WEAKedKHpMZA/exec"
    allow="camera; microphone; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <button id="installBtn" type="button">📚 Instalar Biblioteca CEMTN</button>

  <div id="fallback">
    <div>
      <h2>Não foi possível carregar a Biblioteca CEMTN.</h2>
      <p>Verifique sua conexão e tente novamente.</p>
      <a href="https://script.google.com/macros/s/AKfycbz1ltATqjcvV8HHtRjmbyXtT2BEH42v11NLYXEhy03x0BLDoWt8YbODK_WEAKedKHpMZA/exec">Abrir Biblioteca</a>
    </div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    const iframe = document.getElementById('app');
    const fallback = document.getElementById('fallback');
    const installBtn = document.getElementById('installBtn');
    let installPrompt = null;

    function hideSplash() {
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 260);
    }

    iframe.addEventListener('load', hideSplash);

    setTimeout(() => {
      if (splash.style.display !== 'none') hideSplash();
    }, 5000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installBtn.style.display = 'none';
    });

    window.addEventListener('appinstalled', () => {
      installBtn.style.display = 'none';
    });

    window.addEventListener('offline', () => {
      // O shell abre, mas o sistema precisa de internet para dados em tempo real.
    });
  </script>
</body>
</html>
