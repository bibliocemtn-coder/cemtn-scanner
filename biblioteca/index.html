<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#55158D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Biblioteca CEMTN">

  <title>Biblioteca CEMTN</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-biblioteca-cemtn-192.png">
  <link rel="apple-touch-icon" href="./icon-biblioteca-cemtn-512.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #3B0764, #5B21B6);
      color: white;
    }

    body {
      display: grid;
      place-items: center;
    }

    .box {
      text-align: center;
      padding: 30px;
      max-width: 360px;
    }

    img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 12px 30px #0004;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
    }

    p {
      margin: 8px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      padding: 12px 18px;
      border-radius: 999px;
      background: white;
      color: #4C1D95;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="./icon-biblioteca-cemtn-192.png" alt="">
    <h1>Biblioteca CEMTN</h1>
    <p>Abrindo sua biblioteca…</p>
    <a href="https://script.google.com/macros/s/AKfycbz1ltATqjcvV8HHtRjmbyXtT2BEH42v11NLYXEhy03x0BLDoWt8YbODK_WEAKedKHpMZA/exec">Abrir Biblioteca</a>
  </div>

  <script>
    // Evita o iframe que estava sendo redirecionado para uma página de erro do Google Drive.
    // O sistema passa a abrir diretamente no próprio contexto do app instalado.
    window.addEventListener('load', function () {
      setTimeout(function () {
        window.location.replace("https://script.google.com/macros/s/AKfycbz1ltATqjcvV8HHtRjmbyXtT2BEH42v11NLYXEhy03x0BLDoWt8YbODK_WEAKedKHpMZA/exec");
      }, 450);
    });
  </script>
</body>
</html>
