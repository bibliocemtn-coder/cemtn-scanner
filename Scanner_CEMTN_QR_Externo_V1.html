<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scanner QR • Biblioteca CEMTN</title>
<style>
:root{--p:#8b5cf6;--d:#4c1d95;--bg:#faf5ff;--ink:#2f1847;--ok:#166534;--bad:#991b1b;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top,#fff,#f8f1ff 55%,#efe6ff);color:#1f2937;min-height:100vh;}
main{max-width:760px;margin:0 auto;padding:18px;}
.card{background:#fff;border:1px solid #eadcff;border-radius:26px;box-shadow:0 16px 40px rgba(76,29,149,.12);padding:20px;}
.topo{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.topo img{width:68px;height:68px;object-fit:contain;border-radius:18px;background:#fff5;padding:6px;box-shadow:0 8px 20px rgba(76,29,149,.12);}
.topo h1{font-size:1.35rem;margin:0;color:var(--d);}
.topo p{margin:4px 0 0;color:#6b7280;}
#readerWrap{position:relative;border-radius:28px;overflow:hidden;background:#f3f4f6;min-height:320px;box-shadow:inset 0 0 0 1px #e9d5ff;}
#readerWrap video{width:100%!important;height:auto!important;display:block;object-fit:cover;background:#111;}
.overlay{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.guia{width:min(70vw,280px);height:min(70vw,280px);border:4px solid rgba(255,255,255,.96);border-radius:24px;box-shadow:0 0 0 9999px rgba(20,8,45,.28);position:relative;}
.guia:before,.guia:after{content:'';position:absolute;width:34px;height:34px;border-color:#f9d87c;border-style:solid;}
.guia:before{top:-4px;left:-4px;border-width:5px 0 0 5px;border-top-left-radius:18px;}
.guia:after{right:-4px;bottom:-4px;border-width:0 5px 5px 0;border-bottom-right-radius:18px;}
.notice{margin-top:14px;padding:12px 14px;border-radius:16px;background:#f6efff;color:#4b5563;line-height:1.45;}
.ok{color:var(--ok);font-weight:700;}
.bad{color:var(--bad);font-weight:700;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
button{border:0;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer;}
.primary{background:linear-gradient(135deg,var(--d),var(--p));color:#fff;}
.secondary{background:#ede9fe;color:#4c1d95;}
.codigo{margin-top:14px;padding:12px;border:1px solid #ddd6fe;border-radius:14px;background:#fff;}
.codigo input{width:100%;padding:12px;border:1px solid #d8b4fe;border-radius:12px;margin-top:8px;}
@media(max-width:640px){main{padding:12px} .topo{align-items:flex-start} .topo img{width:58px;height:58px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

      <div>
        <h1 id="titulo">Scanner QR • Biblioteca CEMTN</h1>
        <p>Escaneie a carteirinha do estudante ou o QR do exemplar.</p>
      </div>
    </div>
    <div id="readerWrap">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="overlay"><div class="guia"></div></div>
    </div>
    <div id="msg" class="notice">Abrindo a câmera traseira…</div>
    <div class="actions">
      <button class="secondary" onclick="alternarCamera()">🔄 Trocar câmera</button>
      <button class="secondary" onclick="ligarNovamente()">⟳ Reiniciar leitor</button>
      <button class="primary" onclick="voltarSemLeitura()">↩ Voltar sem leitura</button>
    </div>
    <div class="codigo">
      <b>Entrada manual (plano B)</b>
      <input id="manual" placeholder="Cole ou digite o código do QR e pressione Enter">
    </div>
  </div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const TARGET = qs.get('target') || '';
const ACAO = qs.get('acao') || '';
const TITULO = qs.get('titulo') || 'Scanner QR';
const RETURN_ORIGIN = qs.get('returnOrigin') || '*';
document.getElementById('titulo').textContent = TITULO;
let stream = null;
let useFront = false;
let running = false;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const msg = document.getElementById('msg');
function setMsg(html){ msg.innerHTML = html; }
async function iniciar(){
  try{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
    const constraints = {video: {facingMode: useFront ? 'user' : 'environment'}, audio:false};
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await video.play();
    running = true;
    setMsg('<span class="ok">Câmera pronta.</span> Aponte o QR para a área destacada.');
    requestAnimationFrame(loop);
  }catch(e){
    setMsg('<span class="bad">Não consegui abrir a câmera.</span> ' + (e.message || e));
  }
}
function enviar(valor){
  const data = {type:'cemtn-qr-scan', value:String(valor||'').trim(), target:TARGET, acao:ACAO};
  if(window.opener && !window.opener.closed){
    try{ window.opener.postMessage(data, RETURN_ORIGIN === '*' ? '*' : RETURN_ORIGIN); }catch(e){}
  }
  setMsg('<span class="ok">QR reconhecido.</span> Voltando para o sistema…');
  setTimeout(()=>{ try{ window.close(); }catch(e){} }, 250);
}
function loop(){
  if(!running) return;
  try{
    const w = video.videoWidth || 0, h = video.videoHeight || 0;
    if(w && h){
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d', {willReadFrequently:true});
      ctx.drawImage(video,0,0,w,h);
      const image = ctx.getImageData(0,0,w,h);
      const code = jsQR(image.data, image.width, image.height, {inversionAttempts:'attemptBoth'});
      if(code && code.data){
        running = false;
        if(navigator.vibrate) try{navigator.vibrate(90);}catch(e){}
        enviar(code.data);
        return;
      }
    }
  }catch(e){
    setMsg('<span class="bad">A câmera abriu, mas houve erro ao analisar a imagem.</span> ' + (e.message || e));
  }
  requestAnimationFrame(loop);
}
function alternarCamera(){ useFront = !useFront; iniciar(); }
function ligarNovamente(){ iniciar(); }
function voltarSemLeitura(){ try{ window.close(); }catch(e){} history.back(); }
document.getElementById('manual').addEventListener('keydown', function(ev){ if(ev.key === 'Enter'){ ev.preventDefault(); if(this.value.trim()) enviar(this.value.trim()); } });
window.addEventListener('load', iniciar);
window.addEventListener('beforeunload', ()=>{ if(stream){ stream.getTracks().forEach(t=>t.stop()); } });
</script>
